<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foxwood Wildflower Hunt</title>
<style>
:root {
  --green:#2f7d32; --green-dark:#1f5f2b; --soft:#edf7ee; --ink:#1d241d; --muted:#5f665f;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#edf7ee 0%,#f7f5ee 100%);color:var(--ink)}
button,select{font-family:inherit}
.sticky-top{position:sticky;top:0;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.10)}
header{background:linear-gradient(135deg,#2f7d32,#1f5f2b);color:#fff;padding:22px 16px 18px;display:flex;justify-content:space-between;gap:14px;align-items:center}
header h1{font-size:26px;margin:0 0 6px;font-weight:950;line-height:1.08}
header p{margin:0;opacity:.86;font-size:14px}
.vault-button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:10px 12px;font-weight:900;display:flex;gap:8px;align-items:center;white-space:nowrap}
.vault-count{background:#fff;color:#1f5f2b;border-radius:999px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center}
.progress-wrap{background:rgba(255,255,255,.94);padding:14px 16px 12px}
.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
#counter{font-weight:950;font-size:24px}
#nextBadgeText{background:#edf7ee;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:900;color:#1f3b22}
.progress-bar{height:15px;border-radius:999px;background:#dcebdd;overflow:hidden}
#barFill{height:100%;background:linear-gradient(90deg,#4fa64c,#8bc34a);width:0%;transition:width .35s ease}

.filter-bar{position:sticky;top:139px;z-index:40;background:rgba(255,255,255,.93);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:9px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;border-bottom:1px solid rgba(31,59,34,.08)}
.filter-bar select{width:100%;border:1px solid #d8e8da;background:#f4f8f4;color:#1f3b22;border-radius:999px;padding:9px 7px;font-weight:850;font-size:12px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:16px;max-width:900px;margin:0 auto 72px}
.flip-card{height:345px;perspective:1000px}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip-card.found .flip-inner{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.12);display:flex;flex-direction:column}
.card-back{transform:rotateY(180deg);color:#fff}
.front-image{height:170px;background-size:cover;background-position:center;position:relative;cursor:pointer}
.front-image:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.56))}
.card-title-overlay{position:absolute;left:13px;right:10px;bottom:12px;z-index:2}
.card-title-overlay h3{margin:0;color:#fff;font-size:22px;line-height:1.02;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.diff-pill{position:absolute;top:10px;left:10px;z-index:3;color:#fff;border-radius:999px;padding:7px 10px;font-weight:950;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.22)}
.diff-pill.easy{background:linear-gradient(135deg,#3f8f42,#6bbf59)}
.diff-pill.medium{background:linear-gradient(135deg,#c78918,#f0b33d)}
.diff-pill.hard{background:linear-gradient(135deg,#7636b8,#a855f7)}
.diff-pill.difficult{background:linear-gradient(135deg,#b71c1c,#e53935)}
.friendly-icons{position:absolute;top:10px;right:10px;z-index:3;display:flex;justify-content:flex-end;max-width:96px}
.friendly-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.9);border-radius:999px;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.16);margin-left:-7px}
.friendly-icon:first-child{margin-left:0}
.card-content{padding:12px;display:flex;flex-direction:column;gap:10px;flex:1}
.card-content h3{display:none}
.look-text{min-height:54px;margin:0;color:#4e594e;font-size:14px;line-height:1.35}
.card-actions{margin-top:auto;display:flex;gap:8px;align-items:center}
.info-button{margin:0;width:46px;min-width:46px;height:46px;padding:0;border-radius:16px;background:#edf7ee;color:#1f3b22;border:1px solid #cfe5d2;font-size:22px;font-weight:950;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(31,59,34,.08)}
.mark-button{margin:0;flex:1;min-height:46px;border:0;background:#3f823a;color:#fff;border-radius:16px;font-size:15px;font-weight:950;line-height:1.08;display:flex;align-items:center;justify-content:center}
.back-bg{position:absolute;inset:0;background-size:cover;background-position:center}
.back-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,0,0,.15),rgba(0,0,0,.52)),var(--accentSoft)}
.back-content{position:relative;z-index:2;height:100%;padding:16px;display:flex;flex-direction:column;justify-content:flex-end}
.collector-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;font-weight:900;opacity:.9}
.collector-title{font-size:26px;line-height:1.02;font-weight:950;margin:5px 0 8px;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.collector-icons{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.collector-icon-pill{background:rgba(255,255,255,.9);color:#1f3b22;border-radius:999px;padding:6px 9px;min-width:34px;text-align:center}
.found-actions{display:flex;gap:10px;align-items:center}
.tick-only{border:0;background:rgba(255,255,255,.92);color:#1f5f2b;border-radius:16px;width:48px;height:48px;font-size:27px;font-weight:950}
.more-info{flex:1;border:0;background:rgba(255,255,255,.92);color:#1f3b22;border-radius:16px;height:48px;font-weight:950}

.info-stage,.image-stage,.vault-panel,.badge-toast{position:fixed;inset:0;display:none;z-index:1000;background:rgba(0,0,0,.58);padding:22px;align-items:center;justify-content:center}
.info-stage.show,.image-stage.show,.vault-panel.show,.badge-toast.show{display:flex}
.info-card{width:min(92vw,430px);max-height:84vh;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:26px;box-shadow:0 18px 70px rgba(0,0,0,.35)}
.info-image{height:210px;min-height:210px;flex:0 0 210px;background-size:cover;background-position:center;position:relative}
.info-image:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.55))}
.info-title{position:absolute;left:18px;right:18px;bottom:18px;z-index:2;color:#fff}
.info-title h2{margin:0;font-size:30px;line-height:1.02;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.info-title div{font-size:13px;margin-top:5px;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.modal-icon{position:absolute;top:14px;width:44px;height:44px;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:#1f3b22;font-size:22px;font-weight:950;z-index:4}
.modal-icon.left{left:14px} .modal-icon.right{right:14px}
.info-body{flex:1 1 auto;overflow:auto;padding:14px 16px 0}
.info-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.info-tag{background:#edf7ee;color:#1f3b22;border-radius:999px;padding:6px 8px;font-weight:900;font-size:12px}
.info-guide-text{color:#4e594e;font-size:15px;line-height:1.42;margin:0 0 10px}
.info-block{margin:9px 0;padding:10px 11px;border-radius:14px;background:#f4f8f4}
.info-block strong{display:block;color:#1f3b22;margin-bottom:3px;font-size:14px}
.info-block span{display:block;color:#4e594e;font-size:13px;line-height:1.32}
.foxwood-clue{background:#eef5ff;border:1px solid #d5e6ff}
.foxwood-clue strong{color:#183a5a} .foxwood-clue span{color:#39556e}
.info-nav{position:sticky;bottom:0;display:flex;margin:12px -16px 0;background:#fff;border-top:1px solid rgba(0,0,0,.06);z-index:8}
.info-nav button{flex:1;border:none;background:transparent;padding:16px 0;font-size:15px;font-weight:800;color:#2e5f3e;display:flex;align-items:center;justify-content:center;gap:6px}
.info-nav button:first-child{border-right:1px solid rgba(0,0,0,.06)}
.info-nav button:active{background:rgba(46,95,62,.08)}

.large-image{max-width:96vw;max-height:86vh;border-radius:18px;box-shadow:0 20px 80px rgba(0,0,0,.45)}
.image-close{position:fixed;top:18px;right:18px;width:46px;height:46px;border:0;border-radius:999px;background:#fff;color:#1f3b22;font-size:24px;font-weight:950}

.vault-panel{align-items:flex-end;padding:0}
.vault-sheet{width:100%;max-height:82vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.vault-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.vault-head h2{margin:0;color:#1f3b22}
.vault-close{border:0;background:#edf7ee;color:#1f3b22;border-radius:999px;width:42px;height:42px;font-size:22px;font-weight:900}
.badge-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.badge-card{border-radius:18px;padding:14px;background:#f4f8f4;border:1px solid #e0ece2;min-height:126px;display:flex;flex-direction:column;justify-content:space-between}
.badge-card.locked{opacity:.42;filter:grayscale(.55)}
.badge-icon{font-size:30px;margin-bottom:8px}
.badge-card h3{margin:0 0 4px;color:#1f3b22;font-size:15px}
.badge-card p{margin:0;color:#536052;font-size:12px;line-height:1.3}
.badge-rarity{margin-top:10px;display:inline-flex;align-self:flex-start;font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;background:#e9f4eb;color:#1f3b22}
.badge-card.epic{background:linear-gradient(135deg,#f3edff,#fff);border-color:#d8c5ff}
.badge-card.legendary{background:linear-gradient(135deg,#fff3ce,#fff);border-color:#f2d36b}
.badge-toast-card{width:min(88vw,340px);border-radius:28px;padding:24px;text-align:center;background:linear-gradient(135deg,#fff,#eef8f0);box-shadow:0 20px 70px rgba(0,0,0,.32);animation:badgePop .42s ease both}
.badge-toast-card.epic{background:linear-gradient(135deg,#fff,#f0e8ff)}
.badge-toast-card.legendary{background:linear-gradient(135deg,#fff,#fff2ba)}
.badge-toast-icon{font-size:54px;margin-bottom:8px} .badge-toast-title{color:#1f3b22;font-size:25px;font-weight:950;margin-bottom:4px} .badge-toast-desc{color:#526052;font-size:15px;line-height:1.35}
@keyframes badgePop{from{transform:scale(.78) translateY(18px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

.reset-wrap{padding:0 16px 32px;max-width:900px;margin:0 auto}
.reset-button{width:100%;border:0;background:#e8eee8;color:#1f3b22;border-radius:16px;padding:14px;font-weight:900}
@media(max-width:430px){header h1{font-size:25px}.grid{gap:12px;padding:14px}.flip-card{height:342px}.front-image{height:170px}.look-text{font-size:14px}}
@media(max-height:720px){.info-card{max-height:81vh}.info-image{height:175px;min-height:175px;flex-basis:175px}.info-guide-text{font-size:14px;line-height:1.36}.info-block span{font-size:12.5px}}

/* V1.3 engagement polish */
.flip-card.found .card-face{box-shadow:0 0 0 3px rgba(79,166,76,.72),0 10px 28px rgba(47,125,50,.24)}
.flip-card.just-found{animation:foundPulse .42s ease both}
@keyframes foundPulse{0%{transform:scale(1)}48%{transform:scale(1.035)}100%{transform:scale(1)}}
.card-back:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.15) 42%,rgba(255,255,255,.36) 50%,rgba(255,255,255,.14) 58%,transparent 100%);opacity:.36;pointer-events:none}
.look-text,.card-title-overlay h3{text-align:left}
.inline-when{display:block!important;margin-top:6px!important;color:#4e594e!important}
.badge-card{cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}
.badge-card:not(.locked){box-shadow:0 6px 18px rgba(31,59,34,.08)}
.badge-card:not(.locked):active{transform:scale(.97)}
.badge-toast-card{position:relative;overflow:hidden}
.badge-toast-card:before,.completion-card:before,.badge-detail-card:before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.65),transparent,rgba(255,255,255,.35),transparent);animation:badgeShimmer 2.8s linear infinite;opacity:.55}
.badge-toast-card>*,.completion-card>*,.badge-detail-card>*{position:relative;z-index:2}
@keyframes badgeShimmer{to{transform:rotate(360deg)}}
.badge-detail{position:fixed;inset:0;z-index:1200;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.58);padding:24px}
.badge-detail.show{display:flex}
.badge-detail-card{width:min(88vw,360px);min-height:460px;border-radius:30px;padding:24px;text-align:center;background:linear-gradient(145deg,#ffffff,#eef8f0);box-shadow:0 24px 80px rgba(0,0,0,.38);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;border:2px solid rgba(255,255,255,.75)}
.badge-detail-card.epic{background:linear-gradient(145deg,#fff,#eee4ff 55%,#fff);border-color:#d8c5ff}
.badge-detail-card.legendary{background:linear-gradient(145deg,#fff,#fff0a8 52%,#fff);border-color:#f5d557}
.badge-detail-close{position:absolute;top:14px;right:14px;z-index:4;width:42px;height:42px;border:0;border-radius:999px;background:rgba(255,255,255,.85);color:#1f3b22;font-size:22px;font-weight:950}
.badge-detail-icon{font-size:82px;margin-bottom:14px}
.badge-detail-title{font-size:30px;font-weight:950;color:#1f3b22;line-height:1.05;margin-bottom:10px}
.badge-detail-desc{color:#536052;line-height:1.4;font-size:16px}
.badge-detail-rarity{margin:18px auto 0;display:inline-flex;border-radius:999px;padding:8px 13px;background:rgba(31,59,34,.08);color:#1f3b22;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:950}
.completion-reward{position:fixed;inset:0;z-index:1300;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,rgba(255,235,128,.5),rgba(0,0,0,.68));padding:24px}
.completion-reward.show{display:flex}
.completion-card{width:min(90vw,380px);border-radius:32px;background:linear-gradient(145deg,#fff,#fff0a8,#fff);box-shadow:0 28px 90px rgba(0,0,0,.45);padding:28px;text-align:center;position:relative;overflow:hidden}
.completion-icon{font-size:88px;margin-bottom:8px}
.completion-title{font-size:32px;font-weight:950;color:#1f3b22;line-height:1.04}
.completion-text{margin-top:10px;color:#526052;font-size:16px;line-height:1.4}
.completion-button{margin-top:20px;border:0;background:#2f7d32;color:#fff;border-radius:18px;padding:14px 18px;font-weight:950;width:100%}
.confetti-piece{position:fixed;top:-12px;width:10px;height:16px;z-index:1400;border-radius:3px;animation:confettiFall 2.8s ease-in forwards}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}


/* V1.4 collector energy layer */

/* Gradient-aligned found card outline */
.flip-card.found .card-face{
  box-shadow:0 10px 28px rgba(0,0,0,.16)!important;
}
.flip-card.found .card-face::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:20px;
  padding:3px;
  background:var(--accentSolid,linear-gradient(160deg,#2f7d32,#76b852));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
  z-index:8;
}
.card-back{
  border:0!important;
}
.card-back::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:20px;
  padding:3px;
  background:var(--accentSolid,linear-gradient(160deg,#2f7d32,#76b852));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
  z-index:5;
}
.flip-card.found{
  filter:drop-shadow(0 9px 18px rgba(31,59,34,.12));
}

/* Found back gets more collector texture without becoming noisy */
.back-bg:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 24% 18%,rgba(255,255,255,.22),transparent 28%),
    radial-gradient(circle at 78% 72%,rgba(255,255,255,.14),transparent 26%),
    linear-gradient(160deg,rgba(0,0,0,.12),rgba(0,0,0,.48)),
    var(--accentSoft);
  z-index:1;
}
.back-bg:after{
  content:"";
  position:absolute;
  inset:-35%;
  z-index:2;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 48%,transparent 62%);
  transform:translateX(-45%) rotate(8deg);
  opacity:.35;
  pointer-events:none;
}

/* Badge vault: make cards feel collectible */
.badge-card{
  position:relative;
  overflow:hidden;
  min-height:148px!important;
  border:0!important;
  color:#fff;
  background:var(--badgeBg,linear-gradient(145deg,#2f7d32,#76b852))!important;
  box-shadow:0 12px 28px rgba(0,0,0,.14)!important;
}
.badge-card.locked{
  background:linear-gradient(145deg,#d8ded8,#eef2ee)!important;
  color:#465146;
  opacity:.68!important;
  filter:grayscale(.55);
}
.badge-card:not(.locked)::before{
  content:"";
  position:absolute;
  inset:-30%;
  background:
    radial-gradient(circle at 28% 24%,rgba(255,255,255,.34),transparent 22%),
    radial-gradient(circle at 76% 78%,rgba(255,255,255,.16),transparent 26%);
  pointer-events:none;
}
.badge-card:not(.locked)::after{
  content:"";
  position:absolute;
  top:-120%;
  left:-150%;
  width:90%;
  height:310%;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);
  transform:rotate(18deg);
  animation:vaultCardShine 5.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes vaultCardShine{
  0%,45%{left:-150%}
  75%,100%{left:150%}
}
.badge-card h3,.badge-card p,.badge-icon,.badge-rarity{
  position:relative;
  z-index:2;
}
.badge-card h3{
  color:#fff!important;
  text-shadow:0 2px 10px rgba(0,0,0,.22);
  font-size:16px!important;
}
.badge-card p{
  color:rgba(255,255,255,.92)!important;
}
.badge-card.locked h3{
  color:#394639!important;
  text-shadow:none;
}
.badge-card.locked p{
  color:#657065!important;
}
.badge-icon{
  width:58px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(255,255,255,.22);
  border:1px solid rgba(255,255,255,.35);
  box-shadow:inset 0 0 18px rgba(255,255,255,.12);
}
.badge-card.locked .badge-icon{
  background:rgba(255,255,255,.6);
  border-color:rgba(255,255,255,.9);
}
.badge-rarity{
  background:rgba(255,255,255,.24)!important;
  color:#fff!important;
  border:1px solid rgba(255,255,255,.34);
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}
.badge-card.locked .badge-rarity{
  background:rgba(255,255,255,.6)!important;
  color:#465146!important;
}

/* rarity backgrounds via class */
.badge-card.common{--badgeBg:linear-gradient(145deg,#2f7d32,#76b852)}
.badge-card.rare{--badgeBg:linear-gradient(145deg,#2563eb,#22c1c3)}
.badge-card.epic{--badgeBg:linear-gradient(145deg,#7c3aed,#ec4899)!important}
.badge-card.legendary{--badgeBg:linear-gradient(145deg,#f59e0b,#ef4444)!important}

/* Badge unlock popup should feel like an earned card */
.badge-toast{
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.18),rgba(0,0,0,.62))!important;
}
.badge-toast-card{
  width:min(88vw,360px)!important;
  min-height:420px;
  border-radius:32px!important;
  padding:28px 22px!important;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  border:3px solid rgba(255,255,255,.38);
  background:linear-gradient(145deg,#2f7d32,#76b852)!important;
  color:#fff;
  animation:badgeCollectIn .5s cubic-bezier(.2,1.05,.22,1) both!important;
}
.badge-toast-card.rare{background:linear-gradient(145deg,#2563eb,#22c1c3)!important}
.badge-toast-card.epic{background:linear-gradient(145deg,#7c3aed,#ec4899)!important}
.badge-toast-card.legendary{background:linear-gradient(145deg,#f59e0b,#ef4444)!important}
@keyframes badgeCollectIn{
  0%{transform:scale(.72) rotate(-5deg);opacity:0}

<body>
<div class="sticky-top">
<header>
  <div>
    <h1>🌼 Foxwood Wildflower Hunt</h1>
    <p>Find flowers, unlock badges, and learn as you explore.</p>
  </div>
  <button class="vault-button" onclick="openVault()">🏅 Vault <span class="vault-count" id="vaultCount">0</span></button>
</header>
<div class="progress-wrap">
  <div class="progress-row"><div id="counter">0 / 24 found</div><div id="nextBadgeText">Find your first flower</div></div>
  <div class="progress-bar"><div id="barFill"></div></div>
</div>
</div>

<div class="filter-bar">
  <select id="filterDifficulty" onchange="applyFilters()">
    <option value="all">All difficulty</option><option value="Easy">Easy</option><option value="Medium">Medium</option><option value="Tricky">Tricky</option><option value="Difficult">Difficult</option>
  </select>
  <select id="filterColour" onchange="applyFilters()"><option value="all">All colours</option></select>
  <select id="filterFound" onchange="applyFilters()">
    <option value="all">All</option><option value="found">Found</option><option value="not-found">Not found</option>
  </select>
</div>

<main class="grid" id="flowerGrid"></main>
<div class="reset-wrap"><button class="reset-button" onclick="resetHunt()">Reset hunt</button></div>

<div class="info-stage" id="infoStage" onclick="if(event.target.id==='infoStage')hideInfo()">
  <div class="info-card">
    <div class="info-image" id="infoImage">
      <button class="modal-icon left" onclick="openCurrentImage()">⛶</button>
      <button class="modal-icon right" onclick="hideInfo()">×</button>
      <div class="info-title"><h2 id="infoTitle"></h2><div id="infoMeta"></div></div>
    </div>
    <div class="info-body">
      <div class="info-tags" id="infoTags"></div>
      <button class="info-found-action" id="infoFoundAction" onclick="toggleCurrentInfoFound(event)">Mark as Found</button>
      <p class="info-guide-text" id="infoText"></p>
      <div class="info-block"><strong>Where and when to find</strong><span id="infoWhereWhen"></span></div>
      <div class="info-block foxwood-clue collapsed" id="foxwoodClueBox" onclick="toggleFoxwoodClue(event)"><strong>🔎 Foxwood clue <em id="clueHint">Tap to reveal</em></strong><span id="infoFoxwoodClue"></span></div>
      <div class="info-nav"><button onclick="previousInfo()">← Previous</button><button onclick="nextInfo()">Next →</button></div>
    </div>
  </div>
</div>

<div class="image-stage" id="imageStage" onclick="if(event.target.id==='imageStage')hideLargeImage()">
  <button class="image-close" onclick="hideLargeImage()">×</button>
  <img class="large-image" id="largeImage" alt="">
</div>

<div class="vault-panel" id="vaultPanel" onclick="if(event.target.id==='vaultPanel')closeVault()">
  <div class="vault-sheet">
    <div class="vault-head"><h2>Collector Badge Vault</h2><button class="vault-close" onclick="closeVault()">×</button></div>
    <div class="badge-grid" id="badgeGrid"></div>
  </div>
</div>

<div class="badge-toast" id="badgeToast" onclick="hideBadgeToast()">
  <div class="badge-toast-card" id="badgeToastCard" onclick="event.stopPropagation()">
    <div class="badge-toast-icon" id="badgeToastIcon"></div>
    <div class="badge-toast-title" id="badgeToastTitle"></div>
    <div class="badge-toast-desc" id="badgeToastDesc"></div>
  </div>
</div>

ge.", "gradient": "linear-gradient(160deg,#e5e7eb,#64748b)", "softGradient": "linear-gradient(160deg,rgba(255,255,255,.32),rgba(100,116,139,.20))", "image": "images/white-bell-flower.jpg", "guide": "This plant has small white bell-shaped flowers that hang down from the stem. Because the flowers droop, it can be missed unless you look underneath the foliage. It is useful for teaching that flower shape is just as important as colour.", "whereFoxwood": "Typically found in shaded grass, woodland edges, damp borders, hedge bases and areas with taller surrounding vegetation.", "difficulty": "Tricky", "foxwoodClue": "Main Pond embankment", "bird": false, "colour": "White", "look": "Drooping white bell-shaped flowers. A good careful-spotting challenge.", "flowering": "Season varies"}, {"name": "Buttercup", "diff": "Easy", "icon": "🌼", "habitat": "Grass", "bee": true, "butterfly": false, "fact": "Shiny yellow petals found in grass and sunny patches.", "gradient": "linear-gradient(160deg,#facc15,#ca8a04)", "softGradient": "linear-gradient(160deg,rgba(250,204,21,.32),rgba(202,138,4,.20))", "image": "images/buttercup.jpg", "guide": "Buttercups are familiar yellow flowers with glossy petals that catch and reflect sunlight. They are visited by small bees, flies and beetles, and they help children compare petal shape, leaf shape and plant height across different yellow flowers.", "whereFoxwood": "Typically found in lawns, meadows, verges, damp grass, open sunny areas and less frequently mown patches.", "difficulty": "Medium", "foxwoodClue": "Pathway edges between the Clump and Small Ponds", "bird": false, "colour": "Yellow", "look": "Shiny yellow petals found in grass and sunny patches.", "flowering": "Season varies"}, {"name": "Phacelia", "diff": "Medium", "icon": "💜", "habitat": "Wild patches", "bee": true, "butterfly": true, "fact": "Purple fuzzy flowers that bees absolutely love.", "gradient": "linear-gradient(160deg,#a855f7,#4338ca)", "softGradient": "linear-gradient(160deg,r let currentInfoIndex = 0;
let badgeToastTimer = null;

function flowerKey(name){return "foxwood-v1-flower-"+name}
function badgeStoreKey(){return "foxwood-v1-badges"}
function esc(s){return String(s).replace(/'/g,"\\'")}
function isFound(name){return localStorage.getItem(flowerKey(name))==="true"}
function difficultyClass(d){
  const x=String(d||"").toLowerCase();
  if(x==="difficult") return "difficult";
  if(x==="tricky"||x==="hard") return "hard";
  if(x==="medium") return "medium";
  return "easy";
}
function setupFilters(){
  const select=document.getElementById("filterColour");
  const colours=[...new Set(flowers.map(f=>f.colour||"Other"))].sort();
  select.innerHTML='<option value="all">All colours</option>'+colours.map(c=>`<option value="${c}">${c}</option>`).join("");
}
function getFriendlyIcons(f){
  let icons="";
  if(f.bee) icons+='<span class="friendly-icon" title="Bee friendly">🐝</span>';
  if(f.butterfly) icons+='<span class="friendly-icon" title="Butterfly friendly">🦋</span>';
  if(f.bird) icons+='<span class="friendly-icon" title="Bird friendly">🐦</span>';
  return icons;
}
function getCollectorIcons(f){
  let icons="";
  if(f.bee) icons+='<span class="collector-icon-pill" title="Bee friendly">🐝</span>';
  if(f.butterfly) icons+='<span class="collector-icon-pill" title="Butterfly friendly">🦋</span>';
  if(f.bird) icons+='<span class="collector-icon-pill" title="Bird friendly">🐦</span>';
  return icons;
}
function renderFlowers(){
  const grid=document.getElementById("flowerGrid");
  grid.innerHTML="";
  flowers.forEach(f=>{
    const found=isFound(f.name);
    const card=document.createElement("div");
    card.className="flip-card flower-card"+(found?" found":"");
    card.dataset.name=f.name;
    card.innerHTML=`
    <div class="flip-inner">
      <div class="card-face front">
        <div class="front-image" style="background-image:url('${f.image}')" onclick="showLargeImage('${esc(f.name)}')">
          <div class="diff-pill ${difficultyClass(f.difficulty)}">${f.difficulty}</div>
          <div class="friendly-icons">${getFriendlyIcons(f)}</div>
          <div class="card-title-overlay"><h3>${f.name}</h3></div>
        </div>
        <div class="card-content">
          <p class="look-text">${f.look||"Tap more info to learn about this find."}</p>
          <div class="card-actions">
            <button class="info-button" onclick="showFlowerInfo('${esc(f.name)}')">?</button>
            <button class="mark-button" onclick="toggleFlower('${esc(f.name)}')">Mark as Found</button>
          </div>
        </div>
      </div>
      <div class="card-face card-back" style="--accentSolid:${f.gradient}">
        <div class="back-bg" style="background-image:url('${f.image}');--accentSoft:${f.softGradient}"></div>
        <div class="back-content">
          <div class="collector-label">Collected flower</div>
          <div class="collector-title">${f.name}</div>
          <div class="collector-icons">${getCollectorIcons(f)}</div>
          <div class="found-actions">
            <button class="tick-only" title="Untick this flower" onclick="toggleFlower('${esc(f.name)}')">✓</button>
            <button class="more-info" onclick="showFlowerInfo('${esc(f.name)}')">More info</button>
          </div>
        </div>
      </div>
    </div>`;
    grid.appendChild(card);
  });
  applyFilters();
}
function flowerMatchesFilters(f){
  const diff=document.getElementById("filterDifficulty").value;
  const colour=document.getElementById("filterColour").value;
  const foundFilter=document.getElementById("filterFound").value;
  if(diff!=="all" && f.difficulty!==diff) return false;
  if(colour!=="all" && f.colour!==colour) return false;
  if(foundFilter==="found" && !isFound(f.name)) return false;
  if(foundFilter==="not-found" && isFound(f.name)) return false;
  return true;
}
function applyFilters(){
  document.querySelectorAll(".flower-card").forEach(card=>{
    const f=flowers.find(x=>x.name===card.dataset.name);
    card.style.display=(f&&flowerMatchesFilters(f))?"":"none";
  });
}
function toggleFlower(name){
  const wasFound=isFound(name);
  localStorage.setItem(flowerKey(name), wasFound ? "false" : "true");
  renderFlowers();
  if(!wasFound){const c=[...document.querySelectorAll(".flower-card")].find(x=>x.dataset.name===name); if(c){c.classList.add("just-found"); setTimeout(()=>c.classList.remove("just-found"),500)}}
  updateAll(!wasFound);
  if(!wasFound){
    const statsAfter=getStats();
    if(statsAfter.count===flowers.length){
      const allBadge=badges.find(b=>b.id==='all');
      if(allBadge) showCompletionReward();
    }
  }
}
function getStats(){
  const stats={count:0,easy:0,medium:0,hard:0,difficult:0,bee:0,butterfly:0,bird:0};
  stats.beeTotal=flowers.filter(f=>f.bee).length;
  stats.butterflyTotal=flowers.filter(f=>f.butterfly).length;
  stats.birdTotal=flowers.filter(f=>f.bird).length;
  flowers.forEach(f=>{
    if(isFound(f.name)){
      stats.count++;
      const dc=difficultyClass(f.difficulty);
      if(dc==="easy") stats.easy++;
      if(dc==="medium") stats.medium++;
      if(dc==="hard") stats.hard++;
      if(dc==="difficult") stats.difficult++;
      if(f.bee) stats.bee++;
      if(f.butterfly) stats.butterfly++;
      if(f.bird) stats.bird++;
    }
  });
  return stats;
}
function updateAll(showPopups=false){
  const stats=getStats();
  document.getElementById("counter").textContent=`${stats.count} / ${flowers.length} found`;
  document.getElementById("barFill").style.width=((stats.count/flowers.length)*100)+"%";
  updateNextBadgeText(stats.count);
  renderBadgeVault();
  if(showPopups) checkBadgeUnlocks(stats); else syncBadgeStore(stats);
}
function updateNextBadgeText(count){
  let text="Find your first flower";
  if(count>=1&&count<5) text=(5-count)+" to next badge";
  if(count>=5&&count<10) text=(10-count)+" to next badge";
  if(count>=10&&count<15) text=(15-count)+" to next badge";
  if(count>=15&&count<20) text=(20-count)+" to next badge";
  if(count>=20&&count<flowers.length) text="Almost complete";
  if(count===flowers.length) text="All found!";
  document.getElementById("nextBadgeText").textContent=text;
}
function unlockedBadgeIds(stats=getStats()){
  return badges.filter(b=>b.test(stats)).map(b=>b.id);
}
function renderBadgeVault(){
  const stats=getStats();
  const unlocked=new Set(unlockedBadgeIds(stats));
  document.getElementById("vaultCount").textContent=unlocked.size;
  const grid=document.getElementById("badgeGrid");
  grid.innerHTML=badges.map(b=>{
    const ok=unlocked.has(b.id);
    return `<div class="badge-card ${b.rarity} ${b.id==='all'?'completion-vault-card':''} ${ok?"":"locked"}" ${ok?`onclick="openBadgeDetail('${b.id}')"`:""}>
      <div><div class="badge-icon">${ok?b.icon:"🔒"}</div><h3>${b.title}</h3><p>${b.id==='all' && ok ? 'Replay your full Foxwood Champion celebration.' : b.desc}</p></div>
      <span class="badge-rarity">${ok?(b.id==='all'?'view celebration':b.rarity):"locked"}</span>
    </div>`;
  }).join("");
}
function currentUnlockedBadgeSet(stats=getStats()){
  return new Set(badges.filter(b=>b.test(stats)).map(b=>b.id));
}

function syncBadgeStore(stats=getStats()){
  localStorage.setItem(badgeStoreKey(), JSON.stringify([...currentUnlockedBadgeSet(stats)]));
}

function checkBadgeUnlocks(stats=getStats()){
  const previous=new Set(JSON.parse(localStorage.getItem(badgeStoreKey())||"[]"));
  const current=currentUnlockedBadgeSet(stats);
  let firstNew=null;

  badges.forEach(b=>{
    if(current.has(b.id) && !previous.has(b.id) && !firstNew){
      firstNew=b;
    }
  });

  localStorage.setItem(badgeStoreKey(), JSON.stringify([...current]));
  renderBadgeVault();

  if(firstNew){
    showBadgeToast(firstNew);
    if(firstNew.id==='all') showCompletionReward();
  }
}
function showBadgeToast(b){
  clearTimeout(badgeToastTimer);
  document.getElementById("badgeToastCard").className=`badge-toast-card ${b.rarity||""}`;
  document.getElementById("badgeToastIcon").textContent=b.icon;
  document.getElementById("badgeToastTitle").textContent=b.title;
  document.getElementById("badgeToastDesc").textContent=b.desc;
  document.getElementById("badgeToast").classList.add("show");
  launchConfetti();
  badgeToastTimer=setTimeout(hideBadgeToast,4600);
}
function hideBadgeToast(){document.getElementById("badgeToast").classList.remove("show")}
function openVault(){renderBadgeVault();document.getElementById("vaultPanel").classList.add("show")}
function closeVault(){document.getElementById("vaultPanel").classList.remove("show")}

function showFlowerInfo(name){
  const f=flowers.find(x=>x.name===name); if(!f) return;
  currentInfoIndex=flowers.findIndex(x=>x.name===name);
  document.getElementById("infoImage").style.backgroundImage=`url('${f.image}')`;
  document.getElementById("infoTitle").textContent=f.name;
  document.getElementById("infoMeta").textContent=`${f.difficulty} · ${f.colour}`;

  if(f.bee) tags+='<span class="info-tag">🐝 Bee friendly</span>';
  if(f.butterfly) tags+='<span class="info-tag">🦋 Butterfly friendly</span>';
  if(f.bird) tags+='<span class="info-tag">🐦 Bird friendly</span>';
  document.getElementById("infoTags").innerHTML=tags;
  document.getElementById("infoText").textContent=f.guide||f.look;
  document.getElementById("infoWhereWhen").innerHTML=`${f.whereFoxwood}<br><span class="inline-when">Flowering: ${f.flowering}</span>`;
  document.getElementById("infoFoxwoodClue").textContent=f.foxwoodClue;
  const clueBox=document.getElementById("foxwoodClueBox");
  if(clueBox){clueBox.classList.add("collapsed"); document.getElementById("clueHint").textContent="Tap to reveal";}
  updateInfoFoundAction();
  document.getElementById("infoStage").classList.add("show");
}
function hideInfo(){document.getElementById("infoStage").classList.remove("show")}
function previousInfo(){currentInfoIndex=(currentInfoIndex-1+flowers.length)%flowers.length;showFlowerInfo(flowers[currentInfoIndex].name)}
function nextInfo(){currentInfoIndex=(currentInfoIndex+1)%flowers.length;showFlowerInfo(flowers[currentInfoIndex].name)}
function showLargeImage(name){
  const f=flowers.find(x=>x.name===name); if(!f) return;

  document.getElementById("largeImage").alt=f.name;
  document.getElementById("imageStage").classList.add("show");
}
function openCurrentImage(){showLargeImage(flowers[currentInfoIndex].name)}
function hideLargeImage(){document.getElementById("imageStage").classList.remove("show")}

function openBadgeDetail(id){
  const stats=getStats();
  const b=badges.find(x=>x.id===id);
  if(!b || !b.test(stats)) return;
  const card=document.getElementById("badgeDetailCard");

function launchConfetti(){
  const colours=["#2f7d32","#8bc34a","#ffd54f","#e53935","#7e57c2","#42a5f5"];
  for(let i=0;i<70;i++){
    const p=document.createElement("div");
    p.className="confetti-piece";
    p.style.left=Math.random()*100+"vw";
    p.style.background=colours[Math.floor(Math.random()*colours.length)];
    p.style.animationDelay=(Math.random()*0.6)+"s";
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),3600);
  }
}
function showCompletionReward(){document.getElementById("completionReward").classList.add("show");launchConfetti()}
function hideCompletionReward(){document.getElementById("completionReward").classList.remove("show");openVault()}


/* V1.6 reward queue + collapsing header */
let rewardQueue=[];
let activeReward=null;
function queueReward(item, priority=false){
  if(priority) rewardQueue.unshift(item);
  else rewardQueue.push(item);
  if(!activeReward) showNextReward();
}

function showNextReward(){
  if(!rewardQueue.length){
    activeReward=null;
    document.getElementById("rewardStage").classList.remove("show");
    return;
  }
  activeReward=rewardQueue.shift();
  const card=document.getElementById("rewardCard");
  const isCompletion=activeReward.type==="completion";
  const rarity=isCompletion ? "completion" : (activeReward.rarity||"common");
  card.className=`reward-card ${rarity}`;
  document.getElementById("rewardProgress").textContent=rewardQueue.length ? `1 of ${rewardQueue.length+1}` : "Collect";
  document.getElementById("rewardKicker").textContent=isCompletion ? "Hunt complete" : "Badge collected";
  document.getElementById("rewardIcon").textContent=activeReward.icon;
  document.getElementById("rewardTitle").textContent=activeReward.title;
  document.getElementById("rewardDesc").textContent=activeReward.desc;
  document.getElementById("rewardCollectButton").textContent=rewardQueue.length ? "Collect & Next" : (isCompletion ? "View Vault" : "Collect");
  document.getElementById("rewardStage").classList.add("show");
  launchConfetti(isCompletion ? 140 : 78);
}

function collectCurrentReward(){
  const wasCompletion=activeReward && activeReward.type==="completion";
  showNextReward();
  if(wasCompletion && !activeReward){
    openVault();
  }
}

function skipRewardQueue(){
  rewardQueue=[];
  activeReward=null;
  document.getElementById("rewardStage").classList.remove("show");
}

function launchConfetti(amount=72){
  const colours=["#2f7d32","#8bc34a","#ffd54f","#e53935","#7e57c2","#42a5f5","#ffffff"];
  for(let i=0;i<amount;i++){
    const p=document.createElement("div");
    p.className="confetti-piece";
    p.style.left=Math.random()*100+"vw";
    p.style.background=colours[Math.floor(Math.random()*colours.length)];
    p.style.animationDelay=(Math.random()*0.65)+"s";
    p.style.animationDuration=(2.25+Math.random()*1.25)+"s";
    p.style.transform=`rotate(${Math.random()*360}deg)`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),3900);
  }
}

/* --- V1.8 stable header + tap-anywhere reward queue override --- */

function queueReward(item, priority=false){
  // Avoid duplicate completion cards in queue if triggered twice.
  if(item.type==="completion"){
    rewardQueue = rewardQueue.filter(r=>r.type!=="completion");
  }
  if(priority) rewardQueue.unshift(item);
  else rewardQueue.push(item);
  if(!activeReward) showNextReward();
}

function showNextReward(){
  const stage=document.getElementById("rewardStage");
  if(!rewardQueue.length){
    activeReward=null;
    stage.classList.remove("show","completion-mode");
    document.body.style.overflow="";
    return;
  }

  activeReward=rewardQueue.shift();
  const card=document.getElementById("rewardCard");
  const isCompletion=activeReward.type==="completion";
  const rarity=isCompletion ? "completion" : (activeReward.rarity||"common");

  document.body.style.overflow="hidden";
  stage.classList.toggle("completion-mode", isCompletion);
  card.className=`reward-card ${rarity}`;

  document.getElementById("rewardProgress").textContent = rewardQueue.length ? `1 of ${rewardQueue.length+1}` : "Collect";
  document.getElementById("rewardKicker").textContent = isCompletion ? "Hunt complete" : "Badge collected";
  document.getElementById("rewardIcon").textContent = activeReward.icon;
  document.getElementById("rewardTitle").textContent = activeReward.title;
  document.getElementById("rewardDesc").textContent = activeReward.desc;

  stage.classList.add("show");
  launchConfetti(isCompletion ? 190 : 85);
}

function collectCurrentReward(){
  const wasCompletion = activeReward && activeReward.type==="completion";
  showNextReward();
  if(wasCompletion && !activeReward){
    openVault();
  }
}

function skipRewardQueue(){
  rewardQueue=[];
  activeReward=null;
  const stage=document.getElementById("rewardStage");
  stage.classList.remove("show","completion-mode");
  document.body.style.overflow="";
}

}

  queueReward({

    title:"Foxwood Champion!",

  }, true);
}

/* Tap badge detail anywhere to close */
function openBadgeDetail(id){
  const stats=getStats();
  const b=badges.find(x=>x.id===id);
  if(!b || !b.test(stats)) return;

  // Legendary completion card replays the celebration instead of normal badge detail.
  if(id==="all"){
    closeVault();
    showCompletionReward();
    return;
  }

  const card=document.getElementById("badgeDetailCard");
  card.className=`badge-detail-card ${b.rarity||""}`;
  document.getElementById("badgeDetailIcon").textContent=b.icon;
  document.getElementById("badgeDetailTitle").textContent=b.title;
  document.getElementById("badgeDetailDesc").textContent=b.desc;
  document.getElementById("badgeDetailRarity").textContent=b.rarity || "badge";
  document.getElementById("badgeDetail").classList.add("show");
}
function closeBadgeDetail(){
  document.getElementById("badgeDetail").classList.remove("show");
}


function updateInfoFoundAction(){
  const btn=document.getElementById("infoFoundAction");
  const f=flowers[currentInfoIndex];
  if(!btn||!f) return;
  const foundNow=isFound(f.name);
  btn.textContent=foundNow ? "✓ Found — tap to untick" : "Mark as Found";
  btn.classList.toggle("is-found", foundNow);
}
function toggleCurrentInfoFound(event){
  if(event) event.stopPropagation();
  const f=flowers[currentInfoIndex];
  if(!f) return;
  toggleFlower(f.name);
  updateInfoFoundAction();
}
function toggleFoxwoodClue(event){
  if(event) event.stopPropagation();
  const box=document.getElementById("foxwoodClueBox");
  if(!box) return;
  const collapsed=box.classList.toggle("collapsed");
  const hint=document.getElementById("clueHint");
  if(hint) hint.textContent=collapsed ? "Tap to reveal" : "Tap to hide";
}

function resetHunt(){
  if(!confirm("Reset all found flowers and badge progress?")) return;
  flowers.forEach(f=>localStorage.removeItem(flowerKey(f.name)));
  localStorage.removeItem(badgeStoreKey());
  hideBadgeToast();
  closeBadgeDetail();
  hideCompletionReward();
  renderFlowers();
  updateAll(false);
}
document.addEventListener("DOMContentLoaded",()=>{setupFilters();renderFlowers();updateAll(false);});
setupFilters();renderFlowers();updateAll(false);

/* V2.1: shrinking header removed for stable production scrolling */
function updateCompactHeader(){
  document.body.classList.remove("header-mini","header-compact");
}

</script>

<div class="badge-detail" id="badgeDetail" onclick="if(event.target.id==='badgeDetail')closeBadgeDetail()">
  <div class="badge-detail-card" id="badgeDetailCard">
    <button class="badge-detail-close" onclick="closeBadgeDetail()">×</button>
    <div class="badge-detail-icon" id="badgeDetailIcon"></div>
    <div class="badge-detail-title" id="badgeDetailTitle"></div>
    <div class="badge-detail-desc" id="badgeDetailDesc"></div>
    <div class="badge-detail-rarity" id="badgeDetailRarity"></div>
  </div>
</div>

<div class="completion-reward" id="completionReward">
  <div class="completion-card">
    <div class="completion-icon">🏆</div>
    <div class="completion-title">Foxwood Champion!</div>
    <div class="completion-text">You found every flower in the hunt and completed the collection.</div>
    <button class="completion-button" onclick="hideCompletionReward()">View my collection</button>
  </div>
</div>


<div class="reward-stage" id="rewardStage" onclick="collectCurrentReward()">
  <div class="reward-card" id="rewardCard">
    <div class="reward-progress" id="rewardProgress"></div>
    <div class="reward-kicker" id="rewardKicker">Badge collected</div>
    <div class="reward-icon" id="rewardIcon"></div>
    <div class="reward-title" id="rewardTitle"></div>
    <div class="reward-desc" id="rewardDesc"></div>
    <div class="reward-actions">
      <button class="secondary" onclick="skipRewardQueue()">Close</button>
      <button onclick="collectCurrentReward()" id="rewardCollectButton">Collect</button>
    </div>
  </div>
</div>

</body>
</html>
